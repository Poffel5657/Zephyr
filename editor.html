<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr Game-Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Zephyr Game-Editor</h1>
        <p class="sub">
          Debug-Werkzeug · speichert direkt in <code>src/data/</code> · das
          Spiel lädt danach von selbst neu
        </p>
      </div>
      <div class="save-box">
        <button type="button" class="primary" id="save-all">Speichern</button>
        <p class="save-status" id="save-status" role="status"></p>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
    <ul class="errors" id="errors" hidden></ul>

    <main class="data-layout" id="data-view" hidden>
      <aside class="panel entries" id="entry-list"></aside>
      <section class="panel entry-form" id="entry-form"></section>
    </main>

    <main class="layout" id="map-view">
      <aside class="panel tools">
        <section>
          <label class="field" for="map-name"
            >Name der Insel
            <input id="map-name" type="text" autocomplete="off" />
          </label>
        </section>

        <section>
          <h2>Werkzeug</h2>
          <div class="seg" id="tool-buttons"></div>
        </section>

        <section id="type-section">
          <h2>Boden</h2>
          <div class="swatches" id="type-buttons"></div>
        </section>

        <section id="object-section" hidden>
          <h2>Objekt</h2>
          <div class="seg" id="object-buttons"></div>
        </section>

        <section id="enemy-section" hidden>
          <h2>Gegner</h2>
          <div class="swatches" id="enemy-buttons"></div>
          <div class="seg" id="enemy-level-buttons"></div>
        </section>

        <section>
          <h2>Karte</h2>
          <div class="size-row">
            <label class="field" for="map-width"
              >Breite (x)
              <input
                id="map-width"
                type="number"
                min="4"
                max="64"
                inputmode="numeric"
              />
            </label>
            <label class="field" for="map-depth"
              >Tiefe (z)
              <input
                id="map-depth"
                type="number"
                min="4"
                max="64"
                inputmode="numeric"
              />
            </label>
            <button type="button" id="apply-size">Übernehmen</button>
          </div>
          <label class="check" for="show-heights">
            <input id="show-heights" type="checkbox" /> Höhen anzeigen
          </label>
        </section>

        <section>
          <div class="row">
            <button type="button" id="undo">Rückgängig</button>
            <button type="button" id="sample">Beispielinsel</button>
            <button type="button" id="clear">Alles leeren</button>
          </div>
        </section>
      </aside>

      <section class="stage">
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="map-canvas" aria-label="Karte"></canvas>
        </div>
        <p class="hover" id="hover-info">&nbsp;</p>
        <p class="status" id="status"></p>
      </section>

      <section class="panel export">
        <h2>JSON</h2>
        <p class="hint">
          So sieht die Karte als Datei aus. „Speichern“ oben schreibt sie nach
          <code>src/data/maps/</code>.
        </p>
        <textarea
          id="json-text"
          spellcheck="false"
          aria-label="Karte als JSON"
        ></textarea>
        <div class="row">
          <button type="button" class="primary" id="copy">JSON kopieren</button>
          <button type="button" id="download">Als Datei speichern</button>
          <label class="file-button" for="open-file"
            >Datei öffnen
            <input id="open-file" type="file" accept=".json,application/json" />
          </label>
          <button type="button" id="load-text">Aus Textfeld laden</button>
        </div>
        <p class="message" id="message" role="status"></p>
      </section>
    </main>

    <script type="module" src="/src/editor/main.js"></script>
  </body>
</html>
